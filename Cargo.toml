[package]
name = "zaaps-dofus3"
version = "1.0.3"
edition = "2021"
build = "build.rs"
authors = ["Zaaps Dofus 3"]
description = "Répertoire de zaaps et raccourcis Ganymède pour Windows"
license = "MIT"
repository = "https://github.com/molow159-boop/zaaps-dofus3"
homepage = "https://github.com/molow159-boop/zaaps-dofus3"
readme = "README.md"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
arboard = { version = "3.4", default-features = false }
regex = "1.11"
uiautomation = { version = "=0.25.1", default-features = false, features = ["pattern", "input", "control"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata]
application = "Zaaps Dofus 3"

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.34"
